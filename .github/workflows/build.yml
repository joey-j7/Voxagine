name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev vulkan-validationlayers \
                                  libwayland-dev libxkbcommon-dev libx11-dev \
                                  libxrandr-dev libxi-dev libxcursor-dev

      # Ubuntu does not package SDL3 yet, so build the release tag we target.
      - name: Build SDL3
        run: |
          git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL.git sdl3
          cmake -S sdl3 -B sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl3/build
          sudo cmake --install sdl3/build

      # VOXAGINE_CHECK_RTTR fetches RTTR and compiles Core/Settings.cpp against
      # it. That is the only thing currently proving the reflection dependency
      # works off Windows, so it stays on until the engine target builds.
      - name: Configure
        run: |
          cmake -S . -B Build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DVOXAGINE_CHECK_RTTR=ON

      # Compile and link only. The runner has no GPU and no display, so the
      # clear-screen loop is not exercised here; run voxagine_bringup locally
      # to verify presentation. Adding a lavapipe + SDL_VIDEODRIVER=offscreen
      # job would make that testable in CI.
      - name: Build
        run: cmake --build Build/ci
