name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [DebugEditor, DebugGame, ReleaseEditor, ReleaseGame]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Builds Game.vcxproj directly (pulls in Voxagine.vcxproj via project
      # reference). UnitTesting is excluded: its gtest usage requires C++17
      # but the project doesn't set a language standard.
      - name: Build ${{ matrix.configuration }}|x64
        run: msbuild Game\Game.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m
